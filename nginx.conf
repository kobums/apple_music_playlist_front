server {
    listen 9002;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable, so they can be cached hard.
    # One directive only: `expires` also emits its own Cache-Control, so pairing
    # it with add_header sent the header twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routing: a refresh on /playlist used to 404 on a plain static
    # server because only index.html exists on disk.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
